<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#ff6b4a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ff3b5c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#shadow)"/>

  <!-- Crosshair Target Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="24" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ffffff" stroke-width="20" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="24" fill="#ffffff"/>

  <!-- Tactical Target Lines -->
  <line x1="256" y1="76" x2="256" y2="136" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="376" x2="256" y2="436" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="76" y1="256" x2="136" y2="256" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="376" y1="256" x2="436" y2="256" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
</svg>
